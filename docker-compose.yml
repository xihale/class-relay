# 启动：cp .env.example .env && docker compose up -d --build
# 对外请放在 HTTPS 反向代理（Caddy / Nginx）后面，并开启 TRUST_PROXY=1。
services:
  class-relay:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      ADDR: ":8080"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
